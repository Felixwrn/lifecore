# LifeCore 2.1 — existing lives and challenge-progress are migrated without deletion.
default-lives: 3
max-lives: 10
mode:
  current: hardcore
storage:
  type: FILE # FILE or MYSQL; a database error never silently resets data to YAML.
  flush-seconds: 30
  mysql:
    host: localhost
    port: 3306
    database: lifecore
    username: lifecore
    password: ''
    password-env: LIFECORE_MYSQL_PASSWORD
    ssl-mode: VERIFY_IDENTITY
    pool-size: 5
    connection-timeout-ms: 5000
ai:
  enabled: false
  api-key: ''
  api-key-env: LIFECORE_OPENAI_API_KEY
  model: gpt-4.1-mini
  endpoint: https://api.openai.com/v1/chat/completions
  timeout-seconds: 30
online:
  enabled: true
  refresh-on-start: true
  timeout-seconds: 15
  allowed-hosts:
    - raw.githubusercontent.com
    - api.github.com
    - github.com
    - objects.githubusercontent.com
    - release-assets.githubusercontent.com
marketplace:
  catalog-url: https://raw.githubusercontent.com/Felixwrn/lifecore/main/online/catalog.json
challenges:
  index-url: https://raw.githubusercontent.com/Felixwrn/lifecore/main/online/challenges/index.json
  refresh-on-start: true
updates:
  check-on-start: true
  interval-minutes: 360
  auto-download: false
  releases-url: https://api.github.com/repos/Felixwrn/lifecore/releases/latest
lives: {}
challenge-progress: {}
settings:
  actionbar: true
  update-interval: 40
